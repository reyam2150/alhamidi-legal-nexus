name: Deploy Lovable site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        
      - name: Check dist
        run: |
          echo "=== Build output ==="
          ls -la
          echo "=== Dist ==="
          ls -la dist
          echo "=== Dist files ==="
          find dist -maxdepth 2 -type f | head -50

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
         path: "./.output"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
